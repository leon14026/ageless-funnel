<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Week Program | Ageless by Tulee</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body data-protected data-requires-entitlement>
    <!-- Navigation -->
    <header class="header">
        <nav class="nav">
            <div class="nav-container">
                <a href="../../index.html" class="logo">
                    <span class="logo-text">Ageless</span>
                    <span class="logo-accent">by Tulee</span>
                </a>
                <button class="mobile-menu-btn" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Programs</a></li>
                    <li><a href="../tracker/index.html">Tracker</a></li>
                    <li class="auth-nav">
                        <a href="../auth/login.html" class="btn btn-nav">Sign In</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="week-page">
        <div class="container">
            <!-- Back Link -->
            <a href="index.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Program
            </a>

            <!-- Week Header -->
            <div class="week-header" id="week-header">
                <div class="loading-spinner">Loading week...</div>
            </div>

            <!-- Week Content -->
            <div class="week-content" id="week-content" style="display: none;">
                <!-- Workout Section -->
                <div class="workout-section">
                    <div class="section-header">
                        <span class="section-icon">💪</span>
                        <h2 id="workout-title">Workout Routine</h2>
                    </div>
                    <p class="workout-description" id="workout-description"></p>

                    <div class="videos-list" id="videos-list">
                        <div class="loading-spinner">Loading videos...</div>
                    </div>
                </div>

                <!-- Diet Section -->
                <div class="diet-section">
                    <div class="diet-card">
                        <div class="section-header">
                            <span class="section-icon">🥗</span>
                            <h2 id="diet-title">Diet Plan</h2>
                        </div>
                        <div class="diet-content" id="diet-content">
                            <!-- Diet content will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Week Navigation -->
            <div class="week-nav" id="week-nav" style="display: none;">
                <a href="#" class="btn btn-secondary" id="prev-week" style="visibility: hidden;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Previous Week
                </a>

                <button class="btn btn-primary" id="complete-btn">
                    Mark as Complete
                </button>

                <a href="#" class="btn btn-secondary" id="next-week" style="visibility: hidden;">
                    Next Week
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </a>
            </div>

            <!-- Error State -->
            <div class="error-state" id="error-state" style="display: none;">
                <span class="error-icon">⚠️</span>
                <h3>Week not found</h3>
                <p>This week hasn't been published yet or doesn't exist.</p>
                <a href="index.html" class="btn btn-primary">Back to Program</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer footer-minimal">
        <div class="container">
            <p>&copy; 2026 Ageless by Tulee. All rights reserved.</p>
        </div>
    </footer>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- App Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/supabase-client.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/payment.js"></script>
    <script src="../../js/auth-guard.js"></script>
    <script src="../../js/programs.js"></script>

    <script>
        let currentWeek = null;
        let weekNumber = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            // Get week number from URL
            const params = new URLSearchParams(window.location.search);
            weekNumber = parseInt(params.get('week')) || 1;

            await loadWeek(weekNumber);
            setupEventListeners();
        });

        async function loadWeek(weekNum) {
            const headerEl = document.getElementById('week-header');
            const contentEl = document.getElementById('week-content');
            const navEl = document.getElementById('week-nav');
            const errorEl = document.getElementById('error-state');

            // Load week data
            const { data: week, error } = await Programs.getWeek(weekNum);

            if (error || !week) {
                headerEl.style.display = 'none';
                errorEl.style.display = 'block';
                return;
            }

            currentWeek = week;

            // Update page title
            document.title = `Week ${week.week_number}: ${week.title} | Ageless by Tulee`;

            // Render header
            headerEl.innerHTML = `
                <span class="week-badge">Week ${week.week_number}</span>
                <h1>${week.title}</h1>
                ${week.description ? `<p class="week-intro">${week.description}</p>` : ''}
            `;

            // Render workout section
            document.getElementById('workout-title').textContent = week.workout_title || 'Workout Routine';
            document.getElementById('workout-description').textContent = week.workout_description || '';

            // Render diet section
            document.getElementById('diet-title').textContent = week.diet_title || 'Diet Plan';
            document.getElementById('diet-content').innerHTML = week.diet_content || '<p>Diet plan content coming soon.</p>';

            // Load videos
            await loadVideos(week.id);

            // Setup navigation
            await setupNavigation(weekNum);

            // Check completion status
            await updateCompleteButton(week.id);

            // Show content
            contentEl.style.display = 'grid';
            navEl.style.display = 'flex';
        }

        async function loadVideos(weekId) {
            const videosEl = document.getElementById('videos-list');

            const { data: videos, error } = await Programs.getWeekVideos(weekId);

            if (error || !videos || videos.length === 0) {
                videosEl.innerHTML = '<p class="no-videos">No workout videos available for this week yet.</p>';
                return;
            }

            videosEl.innerHTML = videos.map(video => Programs.renderVideo(video)).join('');
        }

        async function setupNavigation(currentWeekNum) {
            const prevBtn = document.getElementById('prev-week');
            const nextBtn = document.getElementById('next-week');

            // Previous week
            if (currentWeekNum > 1) {
                prevBtn.href = `week.html?week=${currentWeekNum - 1}`;
                prevBtn.style.visibility = 'visible';
            }

            // Next week (max 16)
            if (currentWeekNum < 16) {
                nextBtn.href = `week.html?week=${currentWeekNum + 1}`;
                nextBtn.style.visibility = 'visible';
            }
        }

        async function updateCompleteButton(weekId) {
            const btn = document.getElementById('complete-btn');
            const isCompleted = await Programs.isWeekCompleted(weekId);

            if (isCompleted) {
                btn.textContent = 'Completed ✓';
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-completed');
            } else {
                btn.textContent = 'Mark as Complete';
                btn.classList.remove('btn-completed');
                btn.classList.add('btn-primary');
            }
        }

        function setupEventListeners() {
            const completeBtn = document.getElementById('complete-btn');

            completeBtn.addEventListener('click', async () => {
                if (!currentWeek) return;

                const isCompleted = await Programs.isWeekCompleted(currentWeek.id);

                if (isCompleted) {
                    // Unmark as complete
                    const { success, error } = await Programs.unmarkWeekComplete(currentWeek.id);
                    if (success) {
                        await updateCompleteButton(currentWeek.id);
                    } else {
                        alert('Failed to update progress. Please try again.');
                    }
                } else {
                    // Mark as complete
                    const { success, error } = await Programs.markWeekComplete(currentWeek.id);
                    if (success) {
                        await updateCompleteButton(currentWeek.id);

                        // Show congratulations
                        if (weekNumber < 16) {
                            const goNext = confirm('Week completed! Would you like to proceed to the next week?');
                            if (goNext) {
                                window.location.href = `week.html?week=${weekNumber + 1}`;
                            }
                        } else {
                            alert('Congratulations! You have completed the entire flexible weekly program! 🎉');
                        }
                    } else {
                        alert('Failed to update progress. Please try again.');
                    }
                }
            });
        }
    </script>
</body>
</html>
