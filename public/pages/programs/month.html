<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Month | Ageless by Tulee</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body data-protected data-requires-entitlement>
    <header class="header">
        <nav class="nav">
            <div class="nav-container">
                <a href="../../index.html" class="logo">
                    <span class="logo-text">Ageless</span>
                    <span class="logo-accent">by Tulee</span>
                </a>
                <button class="mobile-menu-btn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
                <ul class="nav-links">
                    <li><a href="../home/index.html">Home</a></li>
                    <li><a href="index.html" class="active">Programs</a></li>
                    <li><a href="../tracker/index.html">Tracker</a></li>
                    <li class="auth-nav"><a href="../auth/login.html" class="btn btn-nav">Sign In</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="program-page">
        <div class="container">
            <a href="index.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                All Months
            </a>

            <div class="page-header" id="m-header">
                <span class="section-tag" id="m-badge">Month</span>
                <h1 class="section-title" id="m-title">Loading…</h1>
                <p class="section-subtitle" id="m-desc"></p>
            </div>

            <div class="progress-section">
                <div class="progress-text" id="progress-text">Loading progress…</div>
                <div class="progress-bar-container"><div class="progress-bar" id="progress-bar" style="width: 0%"></div></div>
            </div>

            <div class="days-grid" id="days"><div class="loading-spinner">Loading days…</div></div>

            <div class="week-nav" id="month-nav" style="display: none;">
                <a href="#" class="btn btn-secondary" id="prev-month" style="visibility: hidden;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Previous Month
                </a>
                <a href="index.html" class="btn btn-primary">All Months</a>
                <a href="#" class="btn btn-secondary" id="next-month" style="visibility: hidden;">
                    Next Month
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </a>
            </div>

            <div class="error-state" id="error-state" style="display: none;">
                <span class="error-icon">⚠️</span>
                <h3>Month not found</h3>
                <p>This month isn't part of the program yet.</p>
                <a href="index.html" class="btn btn-primary">All Months</a>
            </div>
        </div>
    </main>

    <footer class="footer footer-minimal">
        <div class="container"><p>&copy; 2026 Ageless by Tulee. All rights reserved.</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/supabase-client.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/payment.js"></script>
    <script src="../../js/auth-guard.js"></script>
    <script src="../../js/programs.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const M = parseInt(new URLSearchParams(location.search).get('month'), 10) || 1;
            await Programs.load();
            await Programs.loadAccess();
            await Programs.loadCompletions();
            const mo = Programs.getMonth(M);
            const hideBody = () => {
                document.getElementById('m-header').style.display = 'none';
                document.querySelector('.progress-section').style.display = 'none';
                document.getElementById('days').style.display = 'none';
                document.getElementById('error-state').style.display = 'block';
            };
            if (!mo) { hideBody(); return; }
            // Locked: still on the drip, or beyond what this member's plan includes.
            if (!Programs.isMonthUnlocked(M)) {
                hideBody();
                const es = document.getElementById('error-state');
                if (Programs.isMonthOutOfPlan(M)) {
                    es.innerHTML = '<span class="error-icon">🔒</span><h3>Not included in your plan</h3>' +
                        '<p>Month ' + M + ' isn\'t part of the plan you purchased.</p>' +
                        '<a href="/index.html#/pricing" class="btn btn-primary">See plans</a> ' +
                        '<a href="index.html" class="btn btn-secondary">All Months</a>';
                } else {
                    es.innerHTML = '<span class="error-icon">🔒</span><h3>Unlocks soon</h3>' +
                        '<p>Month ' + M + ' unlocks on ' +
                        Programs.formatUnlockDate(Programs.unlockDateFor(M)) + '.</p>' +
                        '<a href="index.html" class="btn btn-primary">All Months</a>';
                }
                return;
            }
            document.title = `Month ${M} · ${Programs.monthName(M)} | Ageless by Tulee`;
            document.getElementById('m-badge').textContent = `Month ${M}`;
            document.getElementById('m-title').textContent = Programs.monthName(M);
            document.getElementById('m-desc').textContent = mo.description || '';

            const pr = Programs.monthProgress(M);
            const pct = pr.total ? Math.round((pr.done / pr.total) * 100) : 0;
            document.getElementById('progress-text').textContent =
                `${pr.done} of ${pr.total} workout days completed (${pct}%)`;
            document.getElementById('progress-bar').style.width = pct + '%';

            document.getElementById('days').innerHTML = mo.days.map(d => Programs.renderDayCard(M, d)).join('');

            const nums = (Programs._data.months || []).map(x => x.month);
            const prev = document.getElementById('prev-month');
            const next = document.getElementById('next-month');
            if (nums.includes(M - 1) && Programs.isMonthUnlocked(M - 1)) { prev.href = `month.html?month=${M - 1}`; prev.style.visibility = 'visible'; }
            if (nums.includes(M + 1) && Programs.isMonthUnlocked(M + 1)) { next.href = `month.html?month=${M + 1}`; next.style.visibility = 'visible'; }
            document.getElementById('month-nav').style.display = 'flex';
        });
    </script>
</body>
</html>
