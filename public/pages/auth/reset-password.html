<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Reset Password | Ageless by Tulee</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <header class="header">
        <nav class="nav">
            <div class="nav-container">
                <a href="../../index.html" class="logo">
                    <span class="logo-text">Ageless</span>
                    <span class="logo-accent">by Tulee</span>
                </a>
                <ul class="nav-links">
                    <li><a href="../programs/index.html">Programs</a></li>
                    <li><a href="../tracker/index.html">Tracker</a></li>
                    <li class="auth-nav">
                        <a href="login.html" class="btn btn-nav">Sign In</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Reset Password Section -->
    <section class="auth-section">
        <div class="container">
            <div class="auth-card">
                <div class="auth-header">
                    <span class="section-tag">Almost Done</span>
                    <h2 class="section-title">Set New Password</h2>
                    <p class="auth-subtitle">Enter your new password below.</p>
                </div>

                <!-- Error state for invalid/expired link -->
                <div id="error-state" style="display: none;">
                    <div class="form-message form-message--error">
                        This password reset link is invalid or has expired.
                    </div>
                    <a href="forgot-password.html" class="btn btn-primary btn-full" style="margin-top: var(--space-lg);">
                        Request New Link
                    </a>
                </div>

                <!-- Password reset form -->
                <form id="reset-form" class="auth-form">
                    <div class="form-field">
                        <label for="password">New Password</label>
                        <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required minlength="6">
                    </div>

                    <div class="form-field">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required minlength="6">
                    </div>

                    <div id="form-message" class="form-message" style="display: none;"></div>

                    <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
                        Update Password
                    </button>

                    <p class="auth-switch">
                        <a href="login.html">Back to sign in</a>
                    </p>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer footer-minimal">
        <div class="container">
            <p>&copy; 2026 Ageless by Tulee. All rights reserved.</p>
        </div>
    </footer>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- App Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/supabase-client.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/auth-guard.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('reset-form');
            const errorState = document.getElementById('error-state');
            const submitBtn = document.getElementById('submit-btn');
            const messageEl = document.getElementById('form-message');

            // Check if we have a valid session from the reset link
            // Supabase automatically handles the token from the URL hash
            const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

            // Check URL for error parameters (Supabase adds these on invalid links)
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const errorCode = hashParams.get('error_code');
            const errorDescription = hashParams.get('error_description');

            if (errorCode || errorDescription) {
                // Invalid or expired link
                form.style.display = 'none';
                errorState.style.display = 'block';
                return;
            }

            // If no session and no error, might still be processing
            // The form will show, and we'll handle the actual update

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                // Validate passwords match
                if (password !== confirmPassword) {
                    showMessage('Passwords do not match.', 'error');
                    return;
                }

                // Validate password length
                if (password.length < 6) {
                    showMessage('Password must be at least 6 characters.', 'error');
                    return;
                }

                // Disable button and show loading
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span> Updating...';
                messageEl.style.display = 'none';

                try {
                    // Update the password
                    const { data, error } = await Auth.updatePassword(password);

                    if (error) {
                        showMessage(error.message, 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Update Password';
                        return;
                    }

                    // Success
                    showMessage('Password updated successfully! Redirecting to sign in...', 'success');

                    // Sign out and redirect to login
                    setTimeout(async () => {
                        await supabaseClient.auth.signOut();
                        window.location.href = 'login.html';
                    }, 2000);

                } catch (err) {
                    showMessage('An unexpected error occurred. Please try again.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Update Password';
                }
            });

            function showMessage(text, type) {
                messageEl.textContent = text;
                messageEl.className = `form-message form-message--${type}`;
                messageEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
