<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Forgot Password | Ageless by Tulee</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <header class="header">
        <nav class="nav">
            <div class="nav-container">
                <a href="../../index.html" class="logo">
                    <span class="logo-text">Ageless</span>
                    <span class="logo-accent">by Tulee</span>
                </a>
                <ul class="nav-links">
                    <li><a href="../home/index.html">Home</a></li>
                    <li><a href="../programs/index.html">Programs</a></li>
                    <li><a href="../tracker/index.html">Tracker</a></li>
                    <li class="auth-nav">
                        <a href="login.html" class="btn btn-nav">Sign In</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Forgot Password Section -->
    <section class="auth-section">
        <div class="container">
            <div class="auth-card">
                <div class="auth-header">
                    <span class="section-tag">Password Recovery</span>
                    <h2 class="section-title">Forgot Password?</h2>
                    <p class="auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>
                </div>

                <form id="forgot-form" class="auth-form">
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div id="form-message" class="form-message" style="display: none;"></div>

                    <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
                        Send Reset Link
                    </button>

                    <p class="auth-switch">
                        Remember your password? <a href="login.html">Sign in</a>
                    </p>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer footer-minimal">
        <div class="container">
            <p>&copy; 2026 Ageless by Tulee. All rights reserved.</p>
        </div>
    </footer>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- App Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/supabase-client.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/auth-guard.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('forgot-form');
            const submitBtn = document.getElementById('submit-btn');
            const messageEl = document.getElementById('form-message');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();

                // Disable button and show loading
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span> Sending...';
                messageEl.style.display = 'none';

                try {
                    const { data, error } = await Auth.resetPassword(email);

                    if (error) {
                        showMessage(error.message, 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Send Reset Link';
                        return;
                    }

                    // Success
                    showMessage('Check your email! We sent you a password reset link. It may take a few minutes to arrive.', 'success');
                    submitBtn.textContent = 'Email Sent';
                    // Keep button disabled after success

                } catch (err) {
                    showMessage('An unexpected error occurred. Please try again.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                }
            });

            function showMessage(text, type) {
                messageEl.textContent = text;
                messageEl.className = `form-message form-message--${type}`;
                messageEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
